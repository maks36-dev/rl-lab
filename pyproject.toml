[project]
name = "rl-lab"
version = "0.1.0"
description = "Год в RL с упором на инфраструктуру: главы-проекты, общая библиотека rlcore"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch>=2.14,<2.15",
  "numpy>=2.0",
  "gymnasium[classic-control,mujoco]>=1.3",
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  "tensorboard>=2.20",
  "moviepy>=2.0",          # RecordVideo в gymnasium пишет mp4 через moviepy
  "tqdm>=4.66",
]

[dependency-groups]
dev = [
  "pytest>=9.0",
  "ruff>=0.16",
  "ipython>=9.0",
]

# ---- uv: окружение живёт в .venvs/base (см. scripts/env.sh), torch берём с индекса PyTorch под CUDA 13.2
[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu132" }]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

# ---- сборка: rlcore и chapters ставятся как editable-пакеты
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rlcore", "chapters"]

# ---- линтер и тесты
[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [".venvs", "runs", "data", "outputs", "multirun"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
ignore = ["E501"]  # длину строк держит форматтер

[tool.pytest.ini_options]
testpaths = ["tests", "chapters"]
python_files = ["test_*.py"]
addopts = "-q"
